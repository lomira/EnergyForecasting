[project]
name = "weather-data"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"
